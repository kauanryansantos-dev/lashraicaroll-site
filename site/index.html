/* Mensagem do agendamento como conversa de WhatsApp (simulação) */
.wa-chat{width:100%;max-width:460px;border-radius:22px;overflow:hidden;border:1px solid #24304A;background:#0B141A;box-shadow:0 18px 40px -20px rgba(124,203,255,.6)}
.wa-top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#1F2C33}
.wa-top img{width:40px;height:40px;border-radius:50%;object-fit:contain;background:#0A0F1C;border:1px solid #2A3942}
.wa-top div{display:flex;flex-direction:column;line-height:1.25}
.wa-top strong{color:#E9EDEF;font-size:15px}
.wa-top span{color:#8696A0;font-size:12.5px}
.wa-body{display:flex;flex-direction:column;gap:8px;padding:16px 14px 14px;background-color:#0B141A;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:16px 16px}
.wa-msg{position:relative;max-width:88%;padding:8px 10px 6px;border-radius:10px;font-size:14.5px;line-height:1.5;color:#E9EDEF;box-shadow:0 1px 1px rgba(0,0,0,.25)}
.wa-txt{white-space:pre-line;display:block}
.wa-dia{align-self:center;font-size:12px;color:#8696A0;background:#182229;padding:5px 12px;border-radius:8px;margin-bottom:2px}
.wa-eu{align-self:flex-end;background:#005C4B;border-top-right-radius:2px}
.wa-ela{align-self:flex-start;background:#202C33;border-top-left-radius:2px;animation:waIn .4s cubic-bezier(.2,.7,.2,1) both}
.wa-meta{display:block;text-align:right;font-size:11px;color:rgba(233,237,239,.6);margin-top:2px}
.wa-check{color:#53BDEB;letter-spacing:-3px;margin-left:2px}
.wa-dig{display:flex;gap:4px;padding:12px 14px}
.wa-dig i{width:7px;height:7px;border-radius:50%;background:#8696A0;animation:waDot 1.2s ease-in-out infinite}
.wa-dig i:nth-child(2){animation-delay:.15s}.wa-dig i:nth-child(3){animation-delay:.3s}
.wa-nota{display:block;padding:8px 16px 12px;background:#0B141A;font-size:12px;color:#8696A0;text-align:center}
@keyframes waDot{0%,60%,100%{transform:none;opacity:.45}30%{transform:translateY(-4px);opacity:1}}
@keyframes waIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@media (min-width:761px) and (max-width:999px){.wa-chat{max-width:none}}
#agendar .bk-dir .wa-chat{max-width:none}
/* WhatsApp mais elegante (27/10/2026): balões com "rabinho", espaços que acompanham a largura, altura reservada para a conversa não pular enquanto escreve */
.wa-chat{border-radius:24px;box-shadow:0 24px 50px -24px rgba(124,203,255,.55),0 0 0 1px rgba(124,203,255,.08)}
.wa-top{background:linear-gradient(180deg,#24343D,#1B2830);padding:clamp(9px,2.6vw,12px) clamp(12px,3.4vw,16px)}
.wa-top img{width:clamp(34px,9vw,42px);height:clamp(34px,9vw,42px)}
.wa-top strong{font-size:clamp(14px,3.8vw,15.5px)}
.wa-body{min-height:clamp(330px,88vw,392px);padding:clamp(10px,3vw,16px) clamp(8px,2.6vw,14px) 14px;gap:clamp(6px,1.8vw,9px);justify-content:flex-start;
  background-color:#0B141A;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px),radial-gradient(120% 70% at 50% 0%,rgba(124,203,255,.07),transparent 60%);background-size:16px 16px,100% 100%}
.wa-msg{max-width:min(90%,380px);padding:8px 11px 6px;border-radius:12px;font-size:clamp(13.5px,3.7vw,14.8px);line-height:1.5;overflow-wrap:anywhere}
.wa-eu{border-top-right-radius:3px}.wa-ela{border-top-left-radius:3px}
.wa-eu::after,.wa-ela::after{content:"";position:absolute;top:0;width:9px;height:13px}
.wa-eu::after{right:-7px;background:#005C4B;clip-path:polygon(0 0,100% 0,0 100%)}
.wa-ela::after{left:-7px;background:#202C33;clip-path:polygon(0 0,100% 0,100% 100%)}
.wa-meta.wa-oculto{visibility:hidden}
.wa-dia{margin-bottom:2px}
.wa-nota{padding:8px 14px 12px;font-size:clamp(11px,3vw,12px)}
/* Movimento fluido da conversa: o balão inteiro entra de baixo com um leve pulo (nada de letra por letra), o ✓ cinza vira ✓✓ azul,
   os pontinhos de "digitando" aparecem com suavidade. De propósito não segue "reduzir movimento" (efeito curto; o Windows do Kauan está com animações desligadas). */
.wa-msg{animation:waPop .5s cubic-bezier(.2,.9,.3,1.15) both}
.wa-eu{transform-origin:100% 100%}.wa-ela{transform-origin:0 100%}
.wa-eu .wa-check{color:#8696A0;animation:waAzul .45s ease .85s both}
.wa-dig{animation:waPop .4s cubic-bezier(.2,.9,.3,1.15) both}
.wa-dig i{animation:waDot 1s ease-in-out infinite}
@keyframes waPop{0%{opacity:0;transform:translateY(18px) scale(.9)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes waAzul{from{color:#8696A0}to{color:#53BDEB}}
/* barra de mensagem do WhatsApp, embaixo da conversa */
.wa-comp{display:flex;align-items:center;gap:10px;margin:0 clamp(8px,2.6vw,12px) 10px;padding:8px 8px 8px 16px;border-radius:999px;background:#202C33;color:#8696A0;font-size:clamp(13px,3.6vw,14.5px);min-height:44px;overflow:hidden;transition:background .3s ease,color .3s ease}
.wa-comp-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-send{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#2A3942;color:#8696A0;transition:background .3s ease,color .3s ease,transform .3s ease}
.wa-comp-on{color:#E9EDEF;background:#2A3942}
.wa-comp-on .wa-send{background:#00A884;color:#fff;animation:waToque .9s ease-in-out infinite}

.wa-chat .wa-body{min-height:clamp(300px,82vw,360px)}
/* Revisão de responsividade (27/10/2026): nada deve estourar a tela nem ficar desalinhado, do menor celular (280 px) ao computador */
html,body{max-width:100%;overflow-x:clip}
img,video,svg{max-width:100%}
.gbadge{max-width:100%;box-sizing:border-box}
@media (max-width:420px){
.gbadge{white-space:normal!important;flex-wrap:wrap;row-gap:2px;font-size:12px!important;padding:8px 14px!important;border-radius:22px!important;line-height:1.35}
}
/* quebras de linha equilibradas: título e frases curtas sem palavra ou emoji sozinho na última linha */

#regras .neon>div:first-child p,.bk-priv,.wa-nota{text-wrap:balance}
@media (max-width:760px){
.rg-pager button{line-height:1.15;padding:10px 6px}
}

}
/* nomes longos sem espaço (ex.: "ifdkkisnfksifdkk…") não estouram o chip nem a conversa */
.bk-sum button{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Agendamento no celular: botão Continuar (passo 4) e conversa no passo 5; o botão verde só aparece no passo 5 */
.bk-next{display:none}
@media (max-width:760px){

/* Regras de atendimento em 2 páginas no celular (ver js/regras.js). No computador as 12 regras aparecem juntas e o seletor some. */

#agendar .bk-step.is-cur{animation:bkIn .3s ease both}
}

.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
